name: Build, lint, and test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up vp
        uses: voidzero-dev/setup-vp@v1.22.0

      - name: Build
        run: vp run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up vp
        uses: voidzero-dev/setup-vp@v1.22.0

      - name: Build
        run: vp run build

      - name: Lint
        run: vp run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up vp
        uses: voidzero-dev/setup-vp@v1.22.0

      - name: Test
        run: vp test

  test-fail:
    name: Test Fail
    runs-on: ubuntu-latest
    needs: test
    if: failure() && !cancelled() && needs.test.result == 'failure' && github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'renovate[bot]')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.WORKFLOW_PAT }}
          fetch-depth: 0
          persist-credentials: true # needed for later commit

      - name: Set up vp
        uses: voidzero-dev/setup-vp@v1.22.0

      - name: Empty replacements file
        # This is necessary because we want to regenerate the entire map
        run: echo "export default {};" > src/renamedModules.js

      - name: Create Vitest report
        run: vp test --reporter=json --outputFile=out.json || true

      - name: Replace the map
        run: |
          map=$(node scripts/replacements-from-tests.js)
          echo "export default $map" > src/renamedModules.js

      - name: Remove the output file
        run: rm -f out.json || true

      - name: Upgrade Lucide
        run: vp up -L @lucide/svelte

      - name: Bump the version in package.json
        run: |
          jq '.version |= (split(".") | .[1] = (. [1] | tonumber + 1) | .[2] = 0 | join("."))' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Formatting
        run: vp fmt

      - name: Commit and push the changes
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/renamedModules.js package.json pnpm-lock.yaml
          git commit --amend -m "chore(release): update the replacements map"
          git fetch origin ${DEFAULT_BRANCH}:${DEFAULT_BRANCH}
          git rebase ${DEFAULT_BRANCH}
          git checkout ${DEFAULT_BRANCH}
          git merge ${GITHUB_HEAD_REF}
          git push origin ${DEFAULT_BRANCH}:${DEFAULT_BRANCH}
